aid: godhands
name: GodHands
description: >-
  GodHands is a Y Combinator-backed startup (2026, San Francisco) building deterministic
  computer-use infrastructure for AI agents. It provides a high-fidelity execution layer that
  acts as a translation interface between any model or agent runtime and the operating system,
  letting agents reliably operate across desktop and browser applications - including legacy
  software and API-less systems, on the premise that "if a human can see it, GodHands can
  interact with it." Instead of fragile, probabilistic vision-based UI automation, every action
  is designed to be repeatable and predictable, removing hallucination risk from the execution
  layer, and every action is captured in comprehensive, immutable audit logs for debugging,
  accountability, and regulatory compliance. The platform is organized around a Control Plane
  plus Iceberg and Vector surfaces, and is built as the execution engine for any LLM or agent
  framework. Positioned for regulated teams, claims-approval workflows, and moving records from
  legacy terminals into browser-based systems.
